# Single-host production layout: prebuilt images, no bind mounts, MinIO for object storage.
# docker compose -f infrastructure/deploy/docker-compose.prod.yml --env-file .env up -d
name: cutpilot-prod

x-api: &api
  image: ghcr.io/your-org/cutpilot-api:latest
  build:
    context: ../..
    dockerfile: infrastructure/docker/api.Dockerfile
  env_file: ../../.env
  environment:
    APP_ENV: production
    COOKIE_SECURE: "true"
    STORAGE_PROVIDER: s3
    S3_ENDPOINT: http://minio:9000
    WORK_DIR: /data/work
  restart: unless-stopped
  depends_on: [postgres, redis, minio]

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: cutpilot, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}, POSTGRES_DB: cutpilot }
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: ${S3_ACCESS_KEY}, MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY} }
    volumes: [minio-data:/data]
    restart: unless-stopped
  api:
    <<: *api
    command: ["/app/scripts/start-api.sh"]
    ports: ["8000:8000"]
  worker-media:
    <<: *api
    command: ["/app/scripts/start-worker.sh", "media,render", "2"]
  worker-ai:
    <<: *api
    command: ["/app/scripts/start-worker.sh", "ai", "2"]
  web:
    image: ghcr.io/your-org/cutpilot-web:latest
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      target: production
      args: { NEXT_OUTPUT: standalone }
    environment:
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-CutPilot AI}
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on: [api]

volumes:
  postgres-data:
  redis-data:
  minio-data:
