[project]
name = "cutpilot-api"
version = "0.1.0"
description = "CutPilot AI — API and worker services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "celery>=5.4",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.34",
    "boto3>=1.34",
    "opentimelineio>=0.17",
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.4",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "email-validator>=2.2",
    "jsonschema>=4.23",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-aiofiles",
]
# Lightweight local transcription (CPU-friendly, no torch).
local-transcription = ["faster-whisper>=1.0"]
# Full local AI adapters (heavy, GPU recommended). Install on GPU workers only.
local-ai = [
    "faster-whisper>=1.0",
    "whisperx>=3.1",
    "pyannote.audio>=3.3",
    "torch>=2.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cutpilot*"]

[tool.setuptools.package-data]
cutpilot = ["ai/prompts/*.md", "media/models/*.onnx", "media/models/LICENSE.txt", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "ASYNC", "S110", "RUF"]
ignore = ["E501", "RUF012", "B008", "N818", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E402", "ASYNC"]
"alembic/*" = ["I", "E", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: long-running media tests"]
